# ===================================================================
# SupportSphere - backend configuration
# ===================================================================
server.port=8080

# ---------------- MySQL (database: appdb) ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/appdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:examly}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------- JWT ----------------
# Supply JWT_SECRET (Base64, >= 256 bits) and JWT_EXPIRATION (ms) as environment variables.
# The fallback values below exist only so the app runs out of the box in a local/dev workspace.
jwt.secret=${JWT_SECRET:U3VwcG9ydFNwaGVyZURldk9ubHlTZWNyZXRLZXlDaGFuZ2VNZUluUHJvZHVjdGlvbjEyMzQ1Njc4OTA=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------------- CORS ----------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# ---------------- Auto-evaluation toggle ----------------
# SRS "Platform Prerequisites" allow GET /api/ticket and GET /api/feedback to be put in permitAll()
# for the platform's automated test runner. Keep this false for normal (secure) use.
app.security.public-read-endpoints=${PUBLIC_READ_ENDPOINTS:false}

# ---------------- Swagger / OpenAPI ----------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ---------------- Error responses: never leak stack traces ----------------
server.error.include-stacktrace=never
server.error.include-message=never

# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.com.examly.springapp=DEBUG
logging.level.com.examly.springapp.config.JwtAuthenticationFilter=TRACE
logging.level.org.springframework.security=INFO
