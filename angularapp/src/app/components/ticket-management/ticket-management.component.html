<div class="form-card">
  <button *ngIf="isEditMode" type="button" id="backButton" class="btn btn-info btn-sm back-button" (click)="goBack()">Back</button>
  <h2 id="ticketFormTitle">{{ isEditMode ? 'Edit Ticket' : 'Create New Ticket' }}</h2>

  <form id="ticketForm" [formGroup]="ticketForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-group">
      <label for="title">Title<span class="required">*</span></label>
      <input id="title" name="title" class="form-control" formControlName="title" [class.is-invalid]="showError('title')" />
      <div class="error-text" *ngIf="showError('title')">
        <span *ngIf="hasError('title', 'required')">*Title is required</span>
        <span *ngIf="hasError('title', 'maxlength')">*Title must not exceed 100 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description<span class="required">*</span></label>
      <textarea id="description" name="description" class="form-control" formControlName="description"
                [class.is-invalid]="showError('description')"></textarea>
      <div class="error-text" *ngIf="showError('description')">
        <span *ngIf="hasError('description', 'required')">*Description is required</span>
        <span *ngIf="hasError('description', 'maxlength')">*Description must not exceed 2000 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="priority">Priority<span class="required">*</span></label>
      <select id="priority" name="priority" class="form-control" formControlName="priority" [class.is-invalid]="showError('priority')">
        <option value="" disabled>Select Priority</option>
        <option *ngFor="let p of priorities" [value]="p">{{ p }}</option>
      </select>
      <div class="error-text" *ngIf="showError('priority')">*Priority is required</div>
    </div>

    <div class="form-group">
      <label for="issueCategory">Issue Category<span class="required">*</span></label>
      <select id="issueCategory" name="issueCategory" class="form-control" formControlName="issueCategory"
              [class.is-invalid]="showError('issueCategory')">
        <option value="" disabled>Select Issue Category</option>
        <option *ngFor="let c of issueCategories" [value]="c">{{ c }}</option>
      </select>
      <div class="error-text" *ngIf="showError('issueCategory')">*Issue Category is required</div>
    </div>

    <div class="form-error" id="ticketFormError" *ngIf="formMessage">*{{ formMessage }}</div>

    <div class="form-actions">
      <button type="submit" id="submitTicketButton" class="btn btn-primary" [disabled]="loading || ticketForm.disabled">
        {{ isEditMode ? 'Update Ticket' : 'Add Ticket' }}
      </button>
    </div>
  </form>
</div>

<app-message-dialog *ngIf="successMessage" [message]="successMessage" buttonText="Ok" (ok)="onSuccessOk()"></app-message-dialog>
